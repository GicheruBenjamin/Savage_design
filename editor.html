<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Savage | Editor</title>
</head>
<body>
    <header>
        <h1>Savage Editor</h1>
        <a href="index.html">Home</a>
    </header>
    <main>
        <section class="explanation-section">
            <h2>Explanation</h2>
            <p class="explanation"> Lorem, ipsum dolor.</p>
            <button>Download</button>
        </section>
        <section class="present_elements-section">
            <h2>Present Elements</h2>
            <div class="present-elements-container"></div>
        </section>
        <section class="orientation-selector-section">
            <!-- Buttons for changing orientation of the svg image created -->
            <fieldset class="orientation-selector">
              <legend class="subheading">Select orientation</legend>
              <button data-ratio="9:16" type="button" title="Vertical" class="btn">9:16</button>
              <button data-ratio="16:9" type="button" title="Horizontal" class="btn">16:9</button>
              <button data-ratio="1:1" type="button" title="Square" class="btn">1:1</button>
              <button data-ratio="4:5" type="button" title="Portrait" class="btn">4:5</button>
              <button data-ratio="2:3" type="button" title="Classic" class="btn">2:3</button>
              <button data-ratio="21:9" type="button" title="Ultra-wide" class="btn">21:9</button>
              <button data-ratio="3:2" type="button" title="DSLR Camera" class="btn">3:2</button>
            </fieldset>
        </section>
        <section class="playground-section">
            <h2>Playground</h2>
            <div class="playground-container">
                <canvas class="playground-canvas"></canvas>
            </div>
        </section>
        <section class="styles-section">
            <h2>Styles</h2>
            <div class="styles-container"></div>
        </section>
        <section class="element-selector">
            <h2>Element Selector</h2>
            <div class="element-selector-container">
                <button>polygon</button>
                <button>rect</button>
                <button>circle</button>
                <button>ellipse</button>
                <button>line</button>
                <button>path</button>
                <button>text</button>
            </div>
        </section>
    </main>
</body>
</html>
